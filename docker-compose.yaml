# ===============================================================
#  RPanel —— 只需要改下面两处，其它都不用动
#
#    ① ports   左边：对外端口
#    ② volumes 左边：数据保存目录
#
#  不需要 .env，不需要 Dockerfile，不需要任何其它文件。
#  保存好这个文件，执行 docker compose up -d 即可。
# ===============================================================
services:
  rpanel:
    image: zmomo923/rpanel:latest
    container_name: rpanel
    restart: unless-stopped
    ports:
      # ① 对外端口：左边随便改，右边固定 8000 不要动
      - "8990:8000"
    volumes:
      # ② 数据目录：左边随便改（Windows 可写 D:/rpanel-data），右边固定 /data 不要动
      #    数据库、密钥、日志、首次登录密码都在这里面，备份这个目录即可
      - "./data:/data"
    # 内网使用；如需限制来源，改成 "192.168.8.10:8990:8000" 之类
